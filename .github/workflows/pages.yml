name: Deploy Knights of the Eigenrealm to GitHub Pages

# Every branch is checked; only main is deployed. A change is meant to merge
# as soon as it is green, so the checks have to run on the branch, before the
# merge, not only on main after it. A branch is restarted from main before each
# change, so the commit checked here is the commit that merges. The build and
# deploy jobs below gate on main themselves.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Main shares one group and never cancels a deploy that is already
  # publishing - a cancelled deploy can leave the live site on a half-uploaded
  # artifact. A branch or a pull request only checks, so it gets a group of its
  # own (a branch run must never queue in front of a deploy) and a newer push
  # replaces an older run.
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('check-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # scriptable/ is excluded because it is generated output, and it uses
      # top-level await that only parses under module detection. The sync
      # check below regenerates it from index.html, which is the real guard.
      - name: Check JavaScript syntax
        run: |
          find . -type f -name '*.js' -not -path './node_modules/*' -not -path './scriptable/*' \
            -print0 | sort -z | xargs -0 -r -n1 node --check

      - name: Verify index.html is self-contained
        run: |
          node -e '
          const fs = require("fs");
          const html = fs.readFileSync("index.html", "utf8");
          const refs = [...html.matchAll(/(?:src|href)="([^"]+)"/g)].map(m => m[1]);
          const local = refs.filter(r => !/^(https?:|data:|#|mailto:)/.test(r));
          const missing = local.filter(r => !fs.existsSync(r.split("?")[0]));
          if (missing.length) {
            console.error("Missing local assets: " + missing.join(", "));
            process.exit(1);
          }
          console.log(`index.html OK (${(html.length / 1024).toFixed(1)} KB, ${local.length} local refs)`);
          '

      # An icon named in the manifest but missing from the repo produces an
      # install prompt that silently fails, which is worse than no prompt.
      - name: Check the manifest's icons exist
        run: |
          node -e '
          const fs = require("fs");
          const m = JSON.parse(fs.readFileSync("manifest.webmanifest", "utf8"));
          const missing = m.icons.map(i => i.src).filter(p => !fs.existsSync(p));
          if (missing.length) { console.error("Missing icons: " + missing.join(", ")); process.exit(1); }
          const shell = fs.readFileSync("sw.js", "utf8");
          const unlisted = m.icons.map(i => i.src).filter(p => !shell.includes(p));
          if (unlisted.length) { console.error("Not precached by sw.js: " + unlisted.join(", ")); process.exit(1); }
          console.log(`manifest OK (${m.icons.length} icons, all present and precached)`);
          '

      # scriptable/KnightsOfTheEigenrealm.js is generated from index.html. The
      # README asks contributors to regenerate it by hand, which is easy to
      # forget, so fail the build when the committed copy has drifted.
      - name: Check Scriptable build is in sync with index.html
        run: |
          node build-scriptable.js
          if ! git diff --quiet -- scriptable/; then
            echo "::error::scriptable/KnightsOfTheEigenrealm.js is stale. Run 'node build-scriptable.js' and commit the result."
            git diff --stat -- scriptable/
            exit 1
          fi
          echo "Scriptable build matches index.html"

      # The generators are checked against the maths they claim to teach, and
      # the knight codec is checked for a round-trip fixpoint and backward
      # compatibility — the guard that a save format change cannot silently
      # corrupt a knight. No dependencies to install; verify.js is self-contained.
      - name: Run the verification suite
        run: npm test

  # The verification suite above checks what can be checked without a browser.
  # These drive the real index.html in Chromium, because the run loop, the save
  # referee, the opening, and the scheduler only exist once the page is running.
  # Split from validate so a browser problem is never mistaken for a game one.
  playthrough:
    runs-on: ubuntu-latest
    # A whole run takes about five minutes. Without a ceiling a hung step sits
    # for GitHub's default six hours, and because the pages group never cancels
    # a deploy in progress, every later merge queues behind it undeployed.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Which browser build is wanted is decided by the version npm actually
      # resolved, not by the range in package.json. There is no lockfile here,
      # so ^1.49.0 floats - key the cache on what landed rather than on what
      # was asked for, or a Playwright release quietly serves a stale browser.
      - name: Read the resolved Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      # The browser is ~150MB and byte-identical for a given version, so there
      # is no reason to fetch it on every run. A partial or corrupt restore is
      # safe: the install below verifies what is there and re-fetches anything
      # missing.
      - name: Cache the Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # `--with-deps` runs apt-get update before installing anything, and that
      # update reads every repository configured on the runner image - Google's
      # Chrome repo among them, which has nothing to do with this project. When
      # that mirror serves a bad index the deploy goes red with nothing wrong in
      # the build. That is exactly how S11 failed: `Hash Sum mismatch`, after
      # every check that ran had passed, and a merged slice sat undeployed for a
      # day. A stale cached index is what causes it, so clear the lists and try
      # again rather than losing a deploy to someone else's mirror.
      #
      # Note the cache above does NOT cover this: it skips the browser download,
      # not the apt update.
      #
      # And sometimes the Ubuntu archive cannot be reached at all. #25's deploy
      # failed on exactly that - 'Temporary failure resolving archive.ubuntu.com'
      # on every attempt, eighteen minutes of it - while every library Chromium
      # needs was already on the runner image ("already the newest version").
      # What apt could not fetch were extra fonts for scripts the game never
      # shows. So apt is no longer the gate: the browser comes from Playwright's
      # own CDN (or the cache above), the system packages are tried as a bonus
      # with each attempt capped so a stall cannot hang the run, and what decides
      # the step is whether Chromium actually launches.
      - name: Install Playwright
        run: |
          npx playwright install chromium
          for attempt in 1 2 3; do
            # timeout signals the whole process group, so apt goes with it.
            if timeout --kill-after=30 300 npx playwright install-deps chromium; then
              break
            fi
            echo "::warning::playwright install-deps failed (attempt ${attempt})"
            if [ "${attempt}" -lt 3 ]; then
              # Expanded as root inside sh, not by this shell - and partial/ is
              # put back, because apt needs it to exist and will not always
              # recreate it itself.
              sudo sh -c 'rm -rf /var/lib/apt/lists/* && mkdir -p /var/lib/apt/lists/partial'
              sleep $(( attempt * 10 ))
            fi
          done
          if node -e "require('playwright').chromium.launch().then(b => b.close())"; then
            echo "Chromium launches."
          else
            echo "::error::Chromium does not launch, and its system packages could not be installed"
            exit 1
          fi

      - name: Play the game
        run: npm run test:play

      # The Deep's press-on-or-leave fork is only a decision if the depth worth
      # banking at rises with how good the player is. This plays thousands of
      # runs at five accuracy levels and fails if that spread flattens.
      - name: Check the fork still rewards skill
        run: npm run balance

      # And the same question asked of the Summit, whose pressure is thinning
      # air rather than a steepening foe curve. A setting shipped unmeasured is
      # exactly how the Deep once came to be unplayable, so every endless one
      # gets swept — with the knight who would actually be standing there.
      - name: Check the climb still has a top
        run: npm run balance -- --setting summit --lvl 14 --weapon 4 --armor 4 --depth 40

      # And of the Wilds, whose danger rises and falls on a period rather than
      # climbing. A swell is easy to tune into a place that is either never
      # dangerous or never safe, and neither is a decision.
      - name: Check the swell still rewards skill
        run: npm run balance -- --setting wilds --lvl 12 --weapon 3 --armor 3 --depth 40

      # And of the Sea, whose danger is drawn rather than derived. A squall rate
      # is the easiest of the three pressures to set somewhere that either never
      # bites or always does.
      - name: Check the crossing still rewards skill
        run: npm run balance -- --setting sea --lvl 15 --weapon 4 --armor 4 --depth 40

      # And of the Library, whose pressure is the questions rather than the
      # foes. The sweep models the stacks as accuracy lost per tier, because
      # without that it measured the gentlest foe curve in the game and no other
      # pressure at all — and duly reported a setting with no top.
      - name: Check the stacks still have an end
        run: npm run balance -- --setting library --lvl 17 --weapon 5 --armor 5 --depth 40

      # A check that cannot fail proves nothing. tools/mutations.json lists the
      # guards the latest change added, each with a deliberate break; this
      # applies one break at a time, runs the suite that should notice, and
      # fails if any break goes unnoticed. Branches only: main has already had
      # this run on the commit that merged.
      - name: Break each new guard and confirm a check notices
        if: github.ref != 'refs/heads/main' && hashFiles('tools/mutations.json') != ''
        run: node tools/mutate.js tools/mutations.json

      # Pictures of the change, so it can be looked at rather than described.
      - name: Take the screenshots
        if: github.ref != 'refs/heads/main'
        run: npm run shots -- --out shots

      - name: Keep the screenshots
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: shots
          path: shots
          retention-days: 14
          if-no-files-found: ignore

  build:
    needs: [validate, playthrough]
    # Only main is published. A dispatch from another branch checks it and
    # stops here.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
        with:
          # Turn Pages on for the repo if it is not already enabled.
          enablement: true

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html README.md manifest.webmanifest sw.js _site/
          cp -r icons _site/
          # Served so players can copy the iOS script straight from the site.
          cp -r scriptable _site/
          # Pages runs Jekyll over the artifact unless told not to.
          touch _site/.nojekyll
          # The worker must differ byte-for-byte between deploys or browsers
          # never notice there is an update, and players sit on a stale build.
          sed -i "s/^const VERSION = 'dev';/const VERSION = '$(git rev-parse --short HEAD)';/" _site/sw.js
          grep -q "const VERSION = 'dev';" _site/sw.js && { echo "::error::sw.js version was not stamped"; exit 1; } || true
          cat > _site/build-info.json <<JSON
          {
            "version": "$(git rev-parse --short HEAD)",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "ref": "${GITHUB_REF_NAME}"
          }
          JSON
          echo "Built _site ($(find _site -type f | wc -l) files)"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
